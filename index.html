<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confraternização REHAB · 28/11 12horas</title>
<style>
  :root { --bg:#f3f6f5; --card:#fff; --ink:#1f2a27; --muted:#5b6b66; --accent:#2e7d6b; --line:#d3dcd9; --erro:#b3261e; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center; align-items: flex-start;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--card);
    border-radius: 16px; padding: 24px; margin-top: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; line-height: 1.4; }
  label, .rotulo { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  input[type=text], input[type=tel], input[type=number] {
    width: 100%; padding: 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opcoes { display: flex; gap: 10px; }
  .opcao {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 0; padding: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px;
  }
  .opcao:has(input:checked) { border-color: var(--accent); background: #e8f3f0; }
  .opcao input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grade label { margin-top: 0; }
  button {
    width: 100%; margin-top: 22px; padding: 14px; font-size: 1.05rem; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .erro { color: var(--erro); font-size: .92rem; min-height: 1.2em; margin: 12px 0 0; }
</style>
</head>
<body>
<main class="card">

  <form id="form" novalidate>
    <img src="logo-rehab.png" alt="REHAB Academia Terapêutica" style="display:block;width:150px;max-width:60%;margin:0 auto 12px">
    <h1 style="text-align:center">Confraternização REHAB</h1>
    <p class="sub" style="text-align:center">Confirme sua presença no dia 28 de novembro.</p>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required autocomplete="name">

    <label for="whatsapp">WhatsApp (com DDD)</label>
    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(47) 99999-9999" autocomplete="tel" inputmode="tel">

    <span class="rotulo">Você vai à confraternização?</span>
    <div class="opcoes">
      <label class="opcao"><input type="radio" name="vai" value="Sim"> Sim</label>
      <label class="opcao"><input type="radio" name="vai" value="Não"> Não</label>
    </div>

    <div id="pessoas" hidden>
      <div class="grade" style="margin-top:16px">
        <div>
          <label for="adultos">Adultos</label>
          <input type="number" id="adultos" name="adultos" min="0" max="50" inputmode="numeric" value="1">
        </div>
        <div>
          <label for="criancas">Crianças</label>
          <input type="number" id="criancas" name="criancas" min="0" max="50" inputmode="numeric" value="0">
        </div>
      </div>
    </div>

    <p id="erro" class="erro" role="alert"></p>
    <button type="submit" id="btn">Confirmar presença</button>
  </form>

  <section id="confirmacao" hidden>
    <h1>Presença confirmada!</h1>
    <p id="resumo" class="sub"></p>
    <p class="sub">Qualquer novidade, entraremos em contato pelo WhatsApp informado.</p>
  </section>

</main>

<script>
  // URL do Web App do Apps Script (termina em /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIAAlZO53bb5UbVNaN6l6cRFV3BfoWCsn0_hVkHmOBUWIEppida4SZYHYoKpEhkookVA/exec';

  const form = document.getElementById('form');
  const pessoas = document.getElementById('pessoas');
  const erro = document.getElementById('erro');
  const btn = document.getElementById('btn');

  form.querySelectorAll('input[name="vai"]').forEach(r =>
    r.addEventListener('change', () => {
      const vai = form.querySelector('input[name="vai"]:checked').value;
      pessoas.hidden = vai !== 'Sim';
    })
  );

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    erro.textContent = '';

    const marcado = form.querySelector('input[name="vai"]:checked');
    const nome = form.nome.value.trim();
    const whatsapp = form.whatsapp.value.replace(/\D/g, '');
    const vai = marcado ? marcado.value : '';
    const adultos = vai === 'Sim' ? (parseInt(form.adultos.value, 10) || 0) : 0;
    const criancas = vai === 'Sim' ? (parseInt(form.criancas.value, 10) || 0) : 0;

    if (!nome) { erro.textContent = 'Informe seu nome.'; return; }
    if (whatsapp.length < 10) { erro.textContent = 'Informe um WhatsApp válido, com DDD.'; return; }
    if (!vai) { erro.textContent = 'Diga se você vai ou não.'; return; }
    if (vai === 'Sim' && adultos + criancas < 1) { erro.textContent = 'Informe pelo menos 1 pessoa.'; return; }

    const dados = { nome, whatsapp, vai, adultos, criancas };

    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try {
      // no-cors: o Apps Script não devolve cabeçalhos CORS, então a resposta é "opaca".
      // Se a requisição sair sem erro de rede, consideramos enviada.
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dados)
      });
      mostrarConfirmacao(dados);
    } catch (e) {
      erro.textContent = 'Não consegui enviar. Verifique a conexão e tente de novo.';
      btn.disabled = false;
      btn.textContent = 'Confirmar presença';
    }
  });

  function mostrarConfirmacao(d) {
    form.hidden = true;
    document.getElementById('resumo').textContent = d.vai === 'Sim'
      ? `${d.nome}, anotamos ${d.adultos} adulto(s) e ${d.criancas} criança(s) para o dia 28.`
      : `${d.nome}, anotamos que você não poderá comparecer. Obrigado por avisar!`;
    document.getElementById('confirmacao').hidden = false;
  }
</script>
</body>
</html>
